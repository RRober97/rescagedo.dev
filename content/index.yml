blog:
  title: "Últimos artículos"
  description: "Reflexiones sobre automatización, contenedores y desarrollo a medida."
faq:
  title: Preguntas frecuentes
  description: Respuestas sobre mis servicios de administración de sistemas y desarrollo de aplicaciones.
  categories:
    - title: Servicios
      questions:
        - label: ¿Qué tipo de proyectos desarrollas?
          content: |
            Diseño y construyo aplicaciones de gestión internas, integraciones con APIs corporativas y automatizaciones de procesos
            que conectan equipos de negocio con infraestructura tecnológica.
        - label: ¿En qué tecnologías te especializas?
          content: |
            Trabajo principalmente con Python, JavaScript (Vue.js), Directus y bases de datos SQL. Para infraestructura empleo Docker, Docker Compose,
            automatización con scripts y despliegues en la nube (AWS, Azure).
        - label: ¿Ofreces servicios de mantenimiento?
          content: |
            Sí, realizo mantenimiento preventivo y evolutivo de servidores Linux, pipelines de despliegue, copias de seguridad y monitorización con herramientas
            como Grafana y Prometheus.
    - title: Colaboración
      questions:
        - label: ¿Cómo inicias un nuevo proyecto?
          content: |
            Primero reviso los objetivos del negocio, mapeo los procesos actuales y defino un plan de implementación. Después creo un entorno de pruebas,
            despliego la infraestructura necesaria y avanzo de forma iterativa con entregas periódicas.
        - label: ¿Trabajas con equipos existentes?
          content: |
            Sí, puedo integrarme en equipos multidisciplinares, colaborar con departamentos de TI y coordinar despliegues con áreas de negocio.
        - label: ¿Puedes apoyar formaciones internas?
          content: |
            Ofrezco sesiones de transferencia de conocimiento sobre automatización, uso de herramientas y buenas prácticas de administración de sistemas.
    - title: Disponibilidad
      questions:
        - label: ¿En qué idiomas trabajas?
          content: |
            Español nativo e inglés intermedio para reuniones, documentación técnica y coordinación con equipos internacionales.
        - label: ¿Cuál es tu disponibilidad?
          content: |
            Colaboro en proyectos de medio y largo plazo, con posibilidad de soporte puntual para despliegues críticos o consultoría especializada.
        - label: ¿Ofreces soporte remoto?
          content: |
            Sí, puedo operar de forma remota gestionando infraestructuras en la nube, automatizaciones y soporte a usuarios mediante herramientas colaborativas.
