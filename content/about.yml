title: Sobre mí
description: Conoce mi trayectoria como administrador de sistemas y desarrollador de soluciones de gestión a medida.
content: |
  Soy un profesional en **administración de sistemas informáticos y desarrollo de aplicaciones de gestión**, con experiencia en la creación, mantenimiento y despliegue de soluciones empresariales.
  Me apasiona aprender nuevas tecnologías y aplicarlas a proyectos reales, optimizando procesos mediante automatización, virtualización y desarrollo a medida.

  En los últimos años he trabajado en:

  - Desarrollo de aplicaciones internas para gestión, seguimiento de proyectos, facturación e informes.
  - **Administración y mantenimiento de servidores Linux**, incluyendo monitorización, corrección de errores y **comprobación de métricas de rendimiento**.
  - Infraestructura en contenedores (Docker & Docker Compose) para entornos empresariales.
  - Integración de herramientas modernas como Vue.js y Directus para backoffice y aplicaciones web.

  Mi enfoque combina **orden, responsabilidad y visión práctica**, siempre orientado a resultados y con la capacidad de adaptarme a diferentes áreas de TI y negocio.

  ### Experiencia destacada

  - Desarrollo y mantenimiento de aplicaciones de gestión empresarial con Python, Vue.js y Directus (headless CMS) en entornos dockerizados.
  - Automatización de procesos y despliegue de microservicios en contenedores.
  - **Supervisión, mantenimiento y optimización de servidores Linux** para garantizar la disponibilidad, seguridad y estabilidad de los sistemas.
  - **Análisis de logs y métricas** para la detección temprana de incidencias y mejora del rendimiento.
  - Gestión de infraestructuras de red y servicios en la nube (AWS, Azure).
  - Diseño e implementación de copias de seguridad automatizadas, asegurando disponibilidad y recuperación de datos en entornos productivos.
  - Optimización de informes y seguimiento de datos para la toma de decisiones.

  ### Formación y certificaciones

  - Ciclo formativo grado superior en Administración de Sistemas Informáticos en Red (ASIR) – IFP Madrid.
  - Ciclo formativo grado medio en Gestión Administrativa – Cantabria.
  - AWS Cloud Practitioner (06/23).
  - Azure Fundamentals AZ-900 (10/23).
  - Microsoft Office Excel Avanzado.

  ### Competencias técnicas

  - Lenguajes y frameworks: Python, JavaScript (Vue.js), SQL.
  - Sistemas y cloud: Windows Server, **Linux (Debian/Ubuntu/CentOS)**, AWS, Azure.
  - Contenedores y despliegue: Docker, Docker Compose, microservicios.
  - Bases de datos: MySQL, PostgreSQL.
  - Otras: **Mantenimiento preventivo de servidores**, ciberseguridad básica, administración de redes, monitorización de servicios (logs, métricas, uptime) y ofimática avanzada.

  ### Idiomas

  - Español: nativo.
  - Inglés: nivel intermedio (conversación fluida).
